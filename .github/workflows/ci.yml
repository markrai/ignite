# Ignite continuous integration — no secrets, no deploy, no device contact.
# Only an explicitly pushed v<version> tag publishes a GitHub Release (job `release`), and only
# after every other job has passed.
name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    name: Rust workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (report only; large intentional dead_code surface in recovery)
        run: cargo clippy --workspace --all-targets --locked
        continue-on-error: true
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Kindle lib suite
        run: cargo test -p scribe-app --lib --locked

  recovery-isolation:
    name: Recovery and harness isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ripgrep
      - name: Assert recovery stays disabled and harness stays out of release packaging
        run: bash tools/ci/check_recovery_isolation.sh

  armv7-check:
    name: ARMv7hf compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf
      - name: Install cross linker
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gcc-arm-linux-gnueabihf
      - uses: Swatinem/rust-cache@v2
        with:
          key: armv7
      - name: cargo check (Kindle target)
        run: cargo check -p scribe-app -p scribe-lifecycle -p ink-probe --locked --target armv7-unknown-linux-gnueabihf --features scribe-app/restore_from_server

  kindle-installer:
    name: Kindle installer pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Run deployment/kindle tests
        working-directory: deployment/kindle
        run: pytest -q
      - name: Launcher unit tests
        working-directory: tools/kindle_launcher
        run: pytest -q

  ignite-web:
    name: ignite-web production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ignite/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: ignite-web-wasm
      - name: Install npm dependencies
        working-directory: ignite/web
        run: npm ci
      - name: Production build (Cargo WASM + Vite)
        working-directory: ignite/web
        run: npm run build
      - name: Typecheck and lint
        working-directory: ignite/web
        run: |
          npm run typecheck
          npm run lint
      - name: Vitest (fresh WASM)
        working-directory: ignite/web
        run: npm test
      - name: Rust WASM bridge + web fixture parity
        run: |
          cargo test -p scribe-web-wasm --locked
          cargo test -p scribe-sync-tool --test web_fixtures --locked
      - name: Confirm dist WASM matches Cargo artifact
        working-directory: ignite/web
        run: node scripts/verify-dist-wasm.mjs

  ignite-server-linux:
    name: Ignite Server Linux bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ignite/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: ignite-server-linux
      - name: Shell syntax checks
        run: |
          set -euo pipefail
          for f in deployment/linux/*.sh deployment/linux/docker/*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f"
          done
      - name: Build portable Linux bundle
        run: bash deployment/linux/build-bundle.sh dist/ignite-server-linux
      - name: Static bundle checks
        run: bash deployment/linux/test-bundle.sh dist/ignite-server-linux
      - name: Unsafe path rejection
        run: bash deployment/linux/test-path-safety.sh dist/ignite-server-linux
      - name: Staging install / upgrade / rollback seams
        run: bash deployment/linux/test-staging.sh dist/ignite-server-linux
      - name: CARGO_TARGET_DIR binary location
        run: bash deployment/linux/test-cargo-target-dir.sh
      - name: ignite-update (mock releases, staging)
        run: bash deployment/linux/test-update.sh dist/ignite-server-linux
      - name: Package release asset
        run: |
          set -euo pipefail
          bash deployment/linux/package-release.sh dist/ignite-server-linux dist/release
          v="$(tr -d '[:space:]' <ignite/VERSION)"
          test -f "dist/release/ignite-server-$v-linux-$(uname -m).tar.gz"
          (cd dist/release && sha256sum -c ./*.sha256)
      - name: Upload Linux bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ignite-server-linux-bundle
          path: dist/ignite-server-linux/
          retention-days: 7
      - name: Upload release asset artifact
        uses: actions/upload-artifact@v4
        with:
          name: ignite-server-linux-release
          path: dist/release/
          retention-days: 7

  # Docker image + host-network disposable accept (separate from unit tests; Linux Engine only).
  ignite-server-docker:
    name: Ignite Server Docker image
    runs-on: ubuntu-latest
    needs: ignite-server-linux
    steps:
      - uses: actions/checkout@v4
      - name: Download Linux bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: ignite-server-linux-bundle
          path: dist/ignite-server-linux
      - name: Compose/Dockerfile static checks
        run: bash deployment/linux/docker/test-compose-static.sh
      - name: Accept evidence/ownership safety (mocked)
        run: bash deployment/linux/docker/test-accept-safety.sh
      - name: Make bundle binary executable
        run: chmod +x dist/ignite-server-linux/scribe-server
      - name: Build image + disposable accept (host network)
        run: |
          set -euo pipefail
          export IGNITE_DOCKER_ACCEPT=1
          export IGNITE_DOCKER_BUNDLE="$GITHUB_WORKSPACE/dist/ignite-server-linux"
          export IGNITE_DOCKER_EVIDENCE="$GITHUB_WORKSPACE/deployment/linux/docker/evidence-ci"
          export IGNITE_DOCKER_BROWSER_SMOKE=0
          bash deployment/linux/docker/accept-disposable.sh
      - name: Assert evidence contains no secrets
        if: always()
        id: evidence_clean
        run: bash deployment/linux/docker/assert-evidence-clean.sh deployment/linux/docker/evidence-ci
      - name: Upload sanitized Docker accept evidence
        # Only after secret scan passes — never upload raw credentials on failure.
        if: always() && steps.evidence_clean.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ignite-server-docker-evidence
          path: deployment/linux/docker/evidence-ci/
          retention-days: 7
          if-no-files-found: ignore

  ignite-server-firewall:
    name: Ignite Server firewall ownership
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ufw + firewalld ownership (disposable containers)
        run: bash deployment/linux/ci-firewall.sh

  # Focused acceptance harness regressions only — no Multipass, HCS, VM, or Chromium download.
  ignite-accept-regressions:
    name: Ignite Server acceptance regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: deployment/linux/acceptance/browser-smoke/package-lock.json
      - name: Browser-smoke helper tests (pinned Node 20)
        working-directory: deployment/linux/acceptance/browser-smoke
        run: |
          npm ci --omit=dev
          npm test
      - name: Browser smoke exit-status capture (behavioral)
        run: bash deployment/linux/acceptance/test-run-browser-smoke-rc.sh
      - name: Guest browser-class structure
        shell: pwsh
        run: pwsh -NoProfile -File deployment/linux/acceptance/test-guest-browser-class.ps1
      - name: PowerShell argv forwarding (literal --)
        shell: pwsh
        run: pwsh -NoProfile -File deployment/linux/acceptance/test-run-host-ps1-argv.ps1
      - name: Docker networking probe safety
        run: bash deployment/linux/test-docker-network-probe.sh
      - name: Docker Compose/Dockerfile static checks
        run: bash deployment/linux/docker/test-compose-static.sh
      - name: Docker accept evidence/ownership safety
        run: bash deployment/linux/docker/test-accept-safety.sh

  # Publishes the tested Linux server bundle for an explicitly pushed v<version> tag only.
  # Never runs for branch pushes or pull requests; never replaces an existing release.
  release:
    name: GitHub Release (tags only)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - rust-test
      - recovery-isolation
      - armv7-check
      - kindle-installer
      - ignite-web
      - ignite-server-linux
      - ignite-server-docker
      - ignite-server-firewall
      - ignite-accept-regressions
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download release asset artifact
        uses: actions/download-artifact@v4
        with:
          name: ignite-server-linux-release
          path: dist/release
      - name: Verify tag, source, binary and bundle versions agree
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          v="$(tr -d '[:space:]' <ignite/VERSION)"
          [ "$tag" = "v$v" ] || { echo "tag $tag != v$v (ignite/VERSION)" >&2; exit 1; }
          top="ignite-server-$v-linux-x86_64"
          cd dist/release
          [ "$(ls)" = "$(printf '%s\n' "$top.tar.gz" "$top.tar.gz.sha256")" ] || { ls >&2; exit 1; }
          sha256sum -c "$top.tar.gz.sha256"
          tar -xzf "$top.tar.gz"
          grep -qx "version=$v" "$top/.ignite-bundle"
          grep -qx "arch=x86_64" "$top/.ignite-bundle"
          [ "$("$top/scribe-server" --version | tr -d '[:space:]')" = "$v" ]
          rm -rf "$top"
      - name: Publish (refuses to replace an existing release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; its assets are not replaced" >&2
            exit 1
          fi
          pre=()
          case "$tag" in *-*) pre=(--prerelease) ;; esac
          gh release create "$tag" dist/release/* --verify-tag "${pre[@]}" \
            --title "Ignite ${tag#v}" \
            --notes "Ignite Server ${tag#v} for Linux x86_64. Update an installed server with: sudo ignite-update"
