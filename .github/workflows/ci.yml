# Ignite continuous integration — no secrets, no deploy, no device contact.
# Builds Kindle + Linux release artifacts. Publication is promote-publish
# (.github/workflows/release-promote.yml): exact tested CI bytes, never a
# tag-push rebuild. GHCR follows a successful promote of a stable release.
name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    name: Rust workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (report only; large intentional dead_code surface in recovery)
        run: cargo clippy --workspace --all-targets --locked
        continue-on-error: true
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Kindle lib suite
        run: cargo test -p scribe-app --lib --locked

  recovery-isolation:
    name: Recovery and harness isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ripgrep
      - name: Assert recovery stays disabled and harness stays out of release packaging
        run: bash tools/ci/check_recovery_isolation.sh

  armv7-check:
    name: ARMv7hf compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf
      - name: Install cross linker
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gcc-arm-linux-gnueabihf
      - uses: Swatinem/rust-cache@v2
        with:
          key: armv7
      - name: cargo check (Kindle target)
        run: cargo check -p scribe-app -p scribe-lifecycle -p ink-probe --locked --target armv7-unknown-linux-gnueabihf --features scribe-app/restore_from_server

  version-sync:
    name: Version file synchronization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check VERSION / Cargo / web lockfiles
        run: python3 tools/ci/check_version_sync.py
      - name: Version mismatch fixture fails closed
        run: python3 tools/ci/test_check_version_sync.py

  kindle-installer:
    name: Kindle installer pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Run deployment/kindle tests
        working-directory: deployment/kindle
        run: pytest -q
      - name: Launcher unit tests
        working-directory: tools/kindle_launcher
        run: pytest -q

  kindle-package:
    name: Kindle installer package
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert a clean packaging workspace
        run: |
          set -euo pipefail
          for p in target/dropbear-kindle target/armv7-unknown-linux-gnueabihf target/package/kindle; do
            if [ -e "$p" ]; then
              echo "unexpected pre-existing $p on a clean runner" >&2
              exit 1
            fi
          done
      - name: Build customer Scriptlet (pinned Docker, no SkipBuild)
        env:
          IGNITE_DROPBEAR_FORCE: "1"
        run: bash scripts/kindle/package-release.sh
      - name: Verify customer artifacts and Dropbear pin
        run: |
          set -euo pipefail
          v="$(tr -d '[:space:]' <ignite/VERSION)"
          src="target/package/kindle"
          want_sha="$(sed -n 's/^elf_sha256=//p' tools/dropbear/PINNED.txt | tr -d '\r')"
          want_bytes="$(sed -n 's/^elf_bytes=//p' tools/dropbear/PINNED.txt | tr -d '\r')"
          have_sha="$(sha256sum target/dropbear-kindle/dropbearmulti | awk '{print $1}')"
          have_bytes="$(wc -c <target/dropbear-kindle/dropbearmulti | tr -d ' ')"
          if [ "$have_sha" != "$want_sha" ] || [ "$have_bytes" != "$want_bytes" ]; then
            echo "Dropbear ELF pin mismatch have=$have_sha/$have_bytes want=$want_sha/$want_bytes" >&2
            exit 1
          fi
          echo "dropbear_sha256=$have_sha bytes=$have_bytes pin=ok"
          mkdir -p dist/kindle-release
          cp "$src/Install Ignite v$v.sh" "$src/Install Ignite v$v.sha256" dist/kindle-release/
          (cd dist/kindle-release && sha256sum -c "Install Ignite v$v.sha256")
          python3 deployment/kindle/validate_stage.py --sfx "dist/kindle-release/Install Ignite v$v.sh" --version "$v"
          # Slice 3D-B2a.4.3c: reproducible component profiles from the staged payload
          # (build evidence only; not Release assets). SFX↔payload byte equivalence after
          # customer extraction remains a separate blocked check (see docs).
          payload="$(find target/package/kindle/staging -maxdepth 1 -type d -name "Ignite-Kindle-$v" | head -n 1)"
          if [ -z "$payload" ] || [ ! -d "$payload" ]; then
            echo "missing staged payload Ignite-Kindle-$v for component profiles" >&2
            exit 1
          fi
          python3 deployment/kindle/release_component_profiles.py \
            --payload "$payload" --version "$v" --check-deterministic \
            --out-dir target/package/kindle/component-profiles
          test -s target/package/kindle/component-profiles/ignite-kindle-component-profile-package.v1
          # Slice 3D-B2a.4.3d: independent byte-equivalence of the copied customer
          # Scriptlet against the staged payload + canonical package profile.
          # Inspects dist/kindle-release (upload candidate), never executes the Scriptlet.
          python3 deployment/kindle/verify_sfx_payload_equivalence.py \
            --sfx "dist/kindle-release/Install Ignite v$v.sh" \
            --payload "$payload" \
            --version "$v" \
            --package-profile target/package/kindle/component-profiles/ignite-kindle-component-profile-package.v1 \
            --report target/package/kindle/component-profiles/sfx-payload-equivalence.v1
          echo "kindle_sha256=$(cut -d' ' -f1 "dist/kindle-release/Install Ignite v$v.sha256")"
      - name: Upload Kindle release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ignite-kindle-release
          path: dist/kindle-release/
          retention-days: 30
          if-no-files-found: error

  ignite-web:
    name: ignite-web production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ignite/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: ignite-web-wasm
      - name: Install npm dependencies
        working-directory: ignite/web
        run: npm ci
      - name: Production build (Cargo WASM + Vite)
        working-directory: ignite/web
        run: npm run build
      - name: Typecheck and lint
        working-directory: ignite/web
        run: |
          npm run typecheck
          npm run lint
      - name: Vitest (fresh WASM)
        working-directory: ignite/web
        run: npm test
      - name: Rust WASM bridge + web fixture parity
        run: |
          cargo test -p scribe-web-wasm --locked
          cargo test -p scribe-sync-tool --test web_fixtures --locked
      - name: Confirm dist WASM matches Cargo artifact
        working-directory: ignite/web
        run: node scripts/verify-dist-wasm.mjs

  ignite-server-linux:
    name: Ignite Server Linux bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ignite/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: ignite-server-linux
      - name: Shell syntax checks
        run: |
          set -euo pipefail
          for f in deployment/linux/*.sh deployment/linux/docker/*.sh \
                   scripts/kindle/*.sh tools/dropbear/*.sh tools/release/*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f"
          done
      - name: Build portable Linux bundle
        run: bash deployment/linux/build-bundle.sh dist/ignite-server-linux
      - name: Static bundle checks
        run: bash deployment/linux/test-bundle.sh dist/ignite-server-linux
      - name: Unsafe path rejection
        run: bash deployment/linux/test-path-safety.sh dist/ignite-server-linux
      - name: Staging install / upgrade / rollback seams
        run: bash deployment/linux/test-staging.sh dist/ignite-server-linux
      - name: CARGO_TARGET_DIR binary location
        run: bash deployment/linux/test-cargo-target-dir.sh
      - name: ignite-update (mock releases, staging)
        run: bash deployment/linux/test-update.sh dist/ignite-server-linux
      - name: Package release asset
        run: |
          set -euo pipefail
          bash deployment/linux/package-release.sh dist/ignite-server-linux dist/release
          v="$(tr -d '[:space:]' <ignite/VERSION)"
          test -f "dist/release/ignite-server-$v-linux-$(uname -m).tar.gz"
          (cd dist/release && sha256sum -c ./*.sha256)
          echo "linux_sha256=$(awk '{print $1}' "dist/release/ignite-server-$v-linux-$(uname -m).tar.gz.sha256")"
      - name: Upload Linux bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ignite-server-linux-bundle
          path: dist/ignite-server-linux/
          retention-days: 7
      - name: Upload release asset artifact
        uses: actions/upload-artifact@v4
        with:
          name: ignite-server-linux-release
          path: dist/release/
          retention-days: 30

  # Docker image + host-network disposable accept (separate from unit tests; Linux Engine only).
  ignite-server-docker:
    name: Ignite Server Docker image
    runs-on: ubuntu-latest
    needs: ignite-server-linux
    steps:
      - uses: actions/checkout@v4
      - name: Download Linux bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: ignite-server-linux-bundle
          path: dist/ignite-server-linux
      - name: Compose/Dockerfile static checks
        run: bash deployment/linux/docker/test-compose-static.sh
      - name: Accept evidence/ownership safety (mocked)
        run: bash deployment/linux/docker/test-accept-safety.sh
      - name: Make bundle binary executable
        run: chmod +x dist/ignite-server-linux/scribe-server
      - name: Build image + disposable accept (host network)
        run: |
          set -euo pipefail
          export IGNITE_DOCKER_ACCEPT=1
          export IGNITE_DOCKER_BUNDLE="$GITHUB_WORKSPACE/dist/ignite-server-linux"
          export IGNITE_DOCKER_EVIDENCE="$GITHUB_WORKSPACE/deployment/linux/docker/evidence-ci"
          export IGNITE_DOCKER_BROWSER_SMOKE=0
          bash deployment/linux/docker/accept-disposable.sh
      - name: Assert evidence contains no secrets
        if: always()
        id: evidence_clean
        run: bash deployment/linux/docker/assert-evidence-clean.sh deployment/linux/docker/evidence-ci
      - name: Upload sanitized Docker accept evidence
        # Only after secret scan passes — never upload raw credentials on failure.
        if: always() && steps.evidence_clean.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ignite-server-docker-evidence
          path: deployment/linux/docker/evidence-ci/
          retention-days: 7
          if-no-files-found: ignore

  ignite-server-firewall:
    name: Ignite Server firewall ownership
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ufw + firewalld ownership (disposable containers)
        run: bash deployment/linux/ci-firewall.sh

  # Focused acceptance harness regressions only — no Multipass, HCS, VM, or Chromium download.
  ignite-accept-regressions:
    name: Ignite Server acceptance regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: deployment/linux/acceptance/browser-smoke/package-lock.json
      - name: Browser-smoke helper tests (pinned Node 20)
        working-directory: deployment/linux/acceptance/browser-smoke
        run: |
          npm ci --omit=dev
          npm test
      - name: Browser smoke exit-status capture (behavioral)
        run: bash deployment/linux/acceptance/test-run-browser-smoke-rc.sh
      - name: Guest browser-class structure
        shell: pwsh
        run: pwsh -NoProfile -File deployment/linux/acceptance/test-guest-browser-class.ps1
      - name: PowerShell argv forwarding (literal --)
        shell: pwsh
        run: pwsh -NoProfile -File deployment/linux/acceptance/test-run-host-ps1-argv.ps1
      - name: Kindle package-release.ps1 wrapper (SkipBuild)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/kindle/test-package-release.ps1
      - name: Kindle package-release.sh host-owned target/
        run: bash scripts/kindle/test-package-release.sh
      - name: Docker networking probe safety
        run: bash deployment/linux/test-docker-network-probe.sh
      - name: Docker Compose/Dockerfile static checks
        run: bash deployment/linux/docker/test-compose-static.sh
      - name: GHCR publishing guards and image references
        run: bash deployment/linux/docker/test-ghcr-publish.sh
      - name: Offline Kindle release signing helper
        run: python3 tools/release/test_kindle_release_sign.py
      - name: Promote-publish guards
        run: bash tools/release/test-promote-release.sh
      - name: Version file synchronization
        run: python3 tools/ci/check_version_sync.py
      - name: Version mismatch fixture fails closed
        run: python3 tools/ci/test_check_version_sync.py
      - name: Docker accept evidence/ownership safety
        run: bash deployment/linux/docker/test-accept-safety.sh

  # Publication is not performed here. Tag pushes must not rebuild-and-publish.
  # Promote exact CI artifacts via .github/workflows/release-promote.yml.
