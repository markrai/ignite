[package]
name = "scribe-lifecycle"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kindle appmgrd lifecycle host / probe (LIPC load/go/pause/unload)"

[[bin]]
name = "scribe-lifecycle"
