[package]
name = "nbk-reader"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Read-only decoder for Amazon Kindle Scribe notebooks (nbk) — one-way import source"

# Deliberately dependency-free: the Kindle app links this without SQLite, networking or I/O
# beyond reading the source files (see docs/NBK_IMPORT.md).
[dependencies]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Private parity against an external fixture root (`IGNITE_NBK_PARITY_ROOT`) and,
# for import-selection coverage, an external expectation manifest
# (`IGNITE_NBK_PARITY_EXPECTATIONS`). Ordinary `cargo test` / `--all-features`
# never requires private notebook samples: the parity target is feature-gated
# and its tests are `#[ignore]`.
#
#   $env:IGNITE_NBK_PARITY_ROOT = "<absolute external root>"
#   $env:IGNITE_NBK_PARITY_EXPECTATIONS = "<absolute external expectations.json>"
#   cargo test -p nbk-reader --features parity-samples --test parity -- --ignored
[features]
parity-samples = []

[[test]]
name = "parity"
path = "tests/parity.rs"
required-features = ["parity-samples"]
