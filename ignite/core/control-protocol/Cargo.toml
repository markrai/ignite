[package]
name = "control-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "D1 Scribe Server control-plane wire types: ServerId, DNS-SD advertisement, pairing, per-device credentials (no OS/network deps)"

[dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", default-features = false, features = ["std"] }

[dev-dependencies]
serde_json = "1"
